schema_version: "1.0"

workflow:
  base: "speckit"
  policy: "class-workflow"
  description: "Class-based SpecKit workflow profiles for corporate AI/vibe-coding initiatives."

navigation:
  purpose: "Provide class-aware next-step guidance without duplicating extension gates."
  rule: "Use the selected overlay as the primary source for next-step guidance; use this file for class meaning, required commands, required artifacts, and promotion triggers."
  sources:
    classification: ".specify/project.yml#initiative"
    workflow_policy: ".specify/workflows/speckit/class-workflow.yml"
    overlay_dir: ".specify/workflows/overlays/speckit/"
    constitution: ".specify/memory/constitution.md"
  output_sections:
    - "Current position"
    - "Class-specific checks"
    - "Automatic hooks"
    - "Recommended next step"
    - "Human decision needed"
  fallback_rule: "If overlay navigation is missing for the completed command, infer the next required command from the selected class required_commands list and explain the inference."

classes:
  L1:
    name: "Proof of Concept"
    profile: "l1-proof-of-concept"
    overlay: "l1-proof-of-concept"
    core_meaning: "Validate whether the idea, approach, scenario, or technical possibility is worth continuing."
    boundary: "The result can be discarded; there is no obligation to keep using it regularly."
    main_question: "Should this exist or continue?"
    expected_outcome: "Learn, stop, continue, or reframe."
    signals:
      users: "Author, test group, or hypothesis participants."
      environment: "Local, sandbox, prepared data, or limited real sample."
      data: "Synthetic, prepared, historical, or limited real data."
      lifecycle: "Short experiment."
      failure_handling: "Failure is acceptable if it stays inside the PoC boundary."
    required_commands:
      - "/SpecKit Constitution"
      - "/SpecKit Init"
      - "/SpecKit Specify"
      - "/SpecKit Plan"
      - "/SpecKit Tasks"
      - "/SpecKit Implement"
      - "speckit.archive.run"
    conditional_commands:
      - command: "/SpecKit Clarify"
        when: "Unknowns can change scope, acceptance, safety, or effort."
      - command: "speckit.jira.background-trace"
        when: "Automatic after_tasks hook; creates or records skipped Jira projection without manual invocation when project Jira sync is enabled."
    required_artifacts:
      - path: ".specify/memory/constitution.md"
        description: "Project constitution with project governance content. The selected class is stored in `.specify/project.yml`."
      - path: ".specify/project.yml"
        description: "Project settings with selected initiative class and workflow overlay."
      - path: "specs/<feature>/spec.md"
        description: "Feature specification created by /SpecKit Specify; for L1 this may be spec-lite by content, but the file is still SpecKit spec.md."
      - path: "specs/<feature>/checklists/requirements.md"
        description: "Specification quality checklist generated for the feature spec."
      - path: "specs/<feature>/plan.md"
        description: "Implementation plan."
      - path: "specs/<feature>/tasks.md"
        description: "Implementation tasks."
      - path: "specs/<feature>/jira-trace.json"
        description: "Background Jira projection trace written after task generation."
      - path: ".specify/memory/spec.md"
        description: "Project-level consolidated specification updated by archival."
      - path: ".specify/memory/plan.md"
        description: "Project-level consolidated implementation plan updated by archival."
      - path: ".specify/memory/changelog.md"
        description: "Project-level merged feature log updated by archival."
    conditional_artifacts:
      - path: "specs/<feature>/research.md"
        when: "Plan contains unknowns or decisions that need explicit research."
      - path: "specs/<feature>/quickstart.md"
        when: "The result needs a runnable validation guide."
      - path: "specs/<feature>/contracts/"
        when: "The feature exposes or consumes an interface contract."

  L2:
    name: "Pilot"
    profile: "l2-pilot"
    overlay: "l2-pilot"
    core_meaning: "Apply or test the solution in a real or production environment with limited scope and managed risk."
    boundary: "There is a bounded pilot scope, success/stop criteria, fallback, and an explicit decision after the pilot."
    main_question: "Does this work in real use under controlled limits?"
    expected_outcome: "Scale, change, extend, stop, or promote to production."
    signals:
      users: "Pilot users, process participants, customer/internal pilot group."
      environment: "Real or production environment is allowed within pilot limits."
      data: "Real working data with explicit rules and constraints."
      lifecycle: "Bounded pilot period or limited rollout."
      failure_handling: "Failure has a fallback and managed response."
    required_commands:
      - "/SpecKit Constitution"
      - "/SpecKit Init"
      - "/SpecKit Specify"
      - "/SpecKit Clarify"
      - "/SpecKit Plan"
      - "/SpecKit Analyze"
      - "/SpecKit Tasks"
      - "/SpecKit Implement"
      - "/SpecKit Converge"
      - "speckit.verify.run"
      - "speckit.archive.run"
    conditional_commands:
      - command: "/SpecKit Checklist"
        when: "Additional readiness or quality checklist is needed."
      - command: "speckit.jira.background-trace"
        when: "Automatic after_tasks hook; creates or records skipped Jira projection without manual invocation when project Jira sync is enabled."
      - command: "speckit.jira.background-sync"
        when: "Automatic after_implement hook; syncs or records skipped Jira status without manual invocation when project Jira sync is enabled."
    required_artifacts:
      - path: ".specify/memory/constitution.md"
        description: "Project constitution with project governance content. The selected class is stored in `.specify/project.yml`."
      - path: ".specify/project.yml"
        description: "Project settings with selected initiative class and workflow overlay."
      - path: "specs/<feature>/spec.md"
        description: "Feature specification with pilot scope, success/stop criteria, and fallback constraints."
      - path: "specs/<feature>/checklists/requirements.md"
        description: "Specification quality checklist."
      - path: "specs/<feature>/plan.md"
        description: "Implementation plan."
      - path: "specs/<feature>/research.md"
        description: "Research and planning decisions."
      - path: "specs/<feature>/data-model.md"
        description: "Data model when the pilot uses structured data."
      - path: "specs/<feature>/quickstart.md"
        description: "Pilot validation and demo run guide."
      - path: "specs/<feature>/tasks.md"
        description: "Implementation tasks."
      - path: "specs/<feature>/jira-trace.json"
        description: "Background Jira projection trace written after task generation."
      - path: ".specify/memory/spec.md"
        description: "Project-level consolidated specification updated by full-scope archival."
      - path: ".specify/memory/plan.md"
        description: "Project-level consolidated implementation plan updated by full-scope archival."
      - path: ".specify/memory/changelog.md"
        description: "Project-level merged feature log updated by full-scope archival."
    conditional_artifacts:
      - path: "specs/<feature>/contracts/"
        when: "The pilot exposes or consumes an interface contract."
      - path: "specs/<feature>/checklists/*.md"
        when: "Additional QA/security/customer readiness checklists are needed."
      - path: "specs/<feature>/critiques/*.md"
        when: "Formal review output is created."
      - path: "specs/<feature>/jira-mapping.json"
        when: "Jira project is configured and issues were created by the background hook."
      - path: "specs/<feature>/jira-sync-trace.json"
        when: "Jira mapping exists and implementation status sync was attempted."

  L3:
    name: "Production Solution"
    profile: "l3-production-solution"
    overlay: "l3-production-solution"
    core_meaning: "Accept the solution as an ongoing operational or product capability."
    boundary: "There is long-term ownership, support, release/change management, monitoring, and operational responsibility."
    main_question: "Can this be operated as a stable ongoing solution?"
    expected_outcome: "Operate, support, improve, and govern changes."
    signals:
      users: "Target production users, support, operations, owners."
      environment: "Production environment and regular operations."
      data: "Production data under corporate security, audit, and retention rules."
      lifecycle: "Ongoing lifecycle."
      failure_handling: "Failure is handled through operational incident/change processes."
    required_commands:
      - "/SpecKit Constitution"
      - "/SpecKit Init"
      - "/SpecKit Specify"
      - "/SpecKit Clarify"
      - "/SpecKit Plan"
      - "speckit.critique.run"
      - "/SpecKit Analyze"
      - "/SpecKit Tasks"
      - "/SpecKit Implement"
      - "/SpecKit Converge"
      - "speckit.verify.run"
      - "speckit.archive.run"
    conditional_commands:
      - command: "/SpecKit Checklist"
        when: "Release, security, operations, or support readiness checklist is needed."
      - command: "speckit.jira.background-trace"
        when: "Automatic after_tasks hook; creates or records skipped Jira projection without manual invocation when project Jira sync is enabled."
      - command: "speckit.jira.background-sync"
        when: "Automatic after_implement hook; syncs or records skipped Jira status without manual invocation when project Jira sync is enabled."
    required_artifacts:
      - path: ".specify/memory/constitution.md"
        description: "Project constitution with project governance content. The selected class is stored in `.specify/project.yml`."
      - path: ".specify/project.yml"
        description: "Project settings with selected initiative class and workflow overlay."
      - path: "specs/<feature>/spec.md"
        description: "Production-ready feature/product specification."
      - path: "specs/<feature>/checklists/requirements.md"
        description: "Specification quality checklist."
      - path: "specs/<feature>/plan.md"
        description: "Implementation plan with constitution checks."
      - path: "specs/<feature>/critiques/critique-*.md"
        description: "Mandatory dual-lens critique report generated after planning and before tasks."
      - path: "specs/<feature>/research.md"
        description: "Research and production design decisions."
      - path: "specs/<feature>/data-model.md"
        description: "Data model when structured data is involved."
      - path: "specs/<feature>/contracts/"
        description: "Interface contracts when applicable."
      - path: "specs/<feature>/quickstart.md"
        description: "Validation/run guide."
      - path: "specs/<feature>/tasks.md"
        description: "Implementation tasks."
      - path: "specs/<feature>/jira-trace.json"
        description: "Background Jira projection trace written after task generation."
      - path: ".specify/memory/spec.md"
        description: "Project-level consolidated specification updated by full-scope archival."
      - path: ".specify/memory/plan.md"
        description: "Project-level consolidated implementation plan updated by full-scope archival."
      - path: ".specify/memory/changelog.md"
        description: "Project-level merged feature log updated by full-scope archival."
    conditional_artifacts:
      - path: "specs/<feature>/checklists/*.md"
        when: "Release, security, operations, or support readiness checklists are needed."
      - path: "specs/<feature>/critiques/*.md"
        when: "Formal review output is created."
      - path: "specs/<feature>/contracts/*"
        when: "Multiple contracts are maintained."
      - path: "specs/<feature>/jira-mapping.json"
        when: "Jira project is configured and issues were created by the background hook."
      - path: "specs/<feature>/jira-sync-trace.json"
        when: "Jira mapping exists and implementation status sync was attempted."

promotion_triggers:
  L1_to_L2:
    from: "L1"
    to: "L2"
    when: "The team wants to test or use the result in real work, with real users/process participants, real working data, or a production environment."
  L2_to_L3:
    from: "L2"
    to: "L3"
    when: "The pilot result must become an ongoing capability with regular use, support, release/change management, monitoring, or long-term ownership."
